name: Build & Deploy to Strato

on:
  push:
    tags:
      - "v*" # Deploy only when pushing version tags (v1.0.0, v1.1.0, etc.)
  workflow_dispatch: # Allow manual trigger as well

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23.6.1"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite React app
        run: npm run build

      # Run lftp directly instead of the Docker-based pressidium/lftp-mirror-action,
      # whose image build pulls from Docker Hub and fails on rate limits (HTTP 429).
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Strato via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H -p 22 "$FTP_SERVER" >> ~/.ssh/known_hosts
          lftp --env-password -u "$FTP_USERNAME" -p 22 "sftp://$FTP_SERVER" -e "
            set ftp:ssl-force yes;
            set ssl:verify-certificate yes;
            mirror --reverse --only-newer ./build /;
            bye"
